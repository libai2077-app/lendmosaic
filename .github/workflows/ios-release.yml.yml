name: iOS build and optional upload
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (no review submission)
        type: boolean
        default: false
        required: true
      build_number:
        description: Unused positive numeric build number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile, sign, export and optionally upload
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_IPA: ${{ inputs.upload }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash build-upload.sh
      - name: Save IPA and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-release-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Final sensitive-file cleanup
        if: ${{ always() }}
        shell: bash
        run: ruby prepare-signing.rb cleanup
